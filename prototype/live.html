<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Reset — live prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700&display=swap">
<style>
  html, body, #root { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: "Sofia Sans", "Aptos", "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at top left, rgba(123, 169, 143, 0.22), transparent 22%),
      radial-gradient(circle at bottom right, rgba(217, 142, 107, 0.18), transparent 24%),
      linear-gradient(180deg, #18201d 0%, #101513 100%);
    color: #f8f5ef;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  * { box-sizing: border-box; }

  .live-shell {
    min-height: 100dvh;
    display: grid;
    grid-template-columns: minmax(280px, 420px) minmax(320px, 480px);
    gap: 48px;
    align-items: center;
    justify-content: center;
    padding: 40px;
    position: relative;
  }

  .live-shell::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 88px 88px;
    mask-image: radial-gradient(circle at center, black 35%, transparent 85%);
    pointer-events: none;
  }

  .live-copy {
    position: relative;
    z-index: 1;
    max-width: 420px;
  }

  .live-kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border-radius: 999px;
    padding: 8px 14px;
    background: rgba(255,255,255,0.08);
    color: rgba(248,245,239,0.82);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 18px;
    backdrop-filter: blur(18px);
  }

  .live-title {
    margin: 0 0 16px 0;
    font-family: "Sofia Sans", "Aptos", "Segoe UI", system-ui, sans-serif;
    font-size: clamp(46px, 7vw, 78px);
    line-height: 0.94;
    letter-spacing: -0.055em;
    color: #f8f5ef;
    font-weight: 500;
    text-wrap: balance;
  }

  .live-copy p {
    margin: 0;
    font-size: 16px;
    line-height: 1.75;
    color: rgba(248,245,239,0.72);
    font-weight: 450;
    max-width: 36ch;
  }

  .live-meta {
    margin-top: 22px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .meta-pill {
    padding: 10px 14px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    color: rgba(248,245,239,0.84);
    font-size: 13px;
    backdrop-filter: blur(18px);
  }

  .device-stage {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
  }

  .device-stage::before {
    content: "";
    position: absolute;
    width: 460px;
    height: 460px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.03) 45%, transparent 72%);
    filter: blur(8px);
    pointer-events: none;
  }

  .device-float {
    animation: floatPhone 6s ease-in-out infinite;
    transform-origin: center center;
  }

  .screen-enter {
    animation: screenIn 420ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  .board-link {
    position: absolute;
    right: 24px;
    bottom: 22px;
    z-index: 2;
    color: rgba(248,245,239,0.58);
    font-size: 12px;
    text-decoration: none;
    letter-spacing: 0.02em;
  }

  .board-link:hover {
    color: rgba(248,245,239,0.82);
  }

  @keyframes floatPhone {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }

  @keyframes screenIn {
    from { opacity: 0; transform: translateY(16px) scale(0.985); }
    to { opacity: 1; transform: translateY(0px) scale(1); }
  }

  @media (max-width: 980px) {
    body { overflow: auto; }
    .live-shell {
      grid-template-columns: 1fr;
      gap: 28px;
      padding: 28px 18px 36px;
    }
    .live-copy {
      max-width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .live-copy p {
      max-width: 42ch;
    }
    .device-stage::before {
      width: 360px;
      height: 360px;
    }
    .board-link {
      position: static;
      display: block;
      text-align: center;
      margin-top: 18px;
      padding-bottom: 12px;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
  window.UNWIND_API_BASE = "http://127.0.0.1:8000";
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="app/screens.jsx"></script>
<script type="text/babel" src="app/quiz.jsx"></script>
<script type="text/babel" src="app/results.jsx"></script>
<script type="text/babel" src="app/live-main.jsx"></script>
</body>
</html>
